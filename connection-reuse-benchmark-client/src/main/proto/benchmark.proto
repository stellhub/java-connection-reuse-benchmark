syntax = "proto3";

package io.github.stellhub.connectionreuse.proto;

option java_multiple_files = true;
option java_package = "io.github.stellhub.connectionreuse.proto";
option java_outer_classname = "ConnectionReuseBenchmarkProto";

service BenchmarkService {
  rpc Echo(BenchmarkRequest) returns (BenchmarkResponse);
}

message BenchmarkRequest {
  string request_id = 1;
  string payload = 2;
  int32 payload_size_bytes = 3;
}

message BenchmarkResponse {
  string request_id = 1;
  string payload = 2;
  int32 payload_size_bytes = 3;
  int64 server_time_nanos = 4;
}
